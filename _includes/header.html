<header class="site-header">
  <div class="masthead">
    <div class="masthead__inner">
      <a class="court-brand" href="{{ '/' | relative_url }}" aria-label="United States Courts home">
        <img class="court-brand__mark" src="{{ '/assets/uscourts-logo.png' | relative_url }}" alt="">
        <span class="court-brand__text">
          <span class="court-brand__kicker">Federal Judiciary</span>
          <span class="court-brand__title">United States Courts</span>
        </span>
      </a>

      <div class="masthead__tools">
        <form class="site-search" action="{{ '/search.html' | relative_url }}" method="get" role="search">
          <label class="visually-hidden" for="site-search-query">Search court rules and resources</label>
          <input id="site-search-query" type="search" name="q" placeholder="Search the Courts" required>
          <button type="submit">Search</button>
        </form>

        <div class="theme-switcher" role="group" aria-label="Color theme">
          <button type="button" class="theme-switcher__button" data-theme-choice="system">System</button>
          <button type="button" class="theme-switcher__button" data-theme-choice="light">Light</button>
          <button type="button" class="theme-switcher__button" data-theme-choice="dark">Dark</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="primary-nav" aria-label="Primary navigation">
    <div class="primary-nav__inner">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/docket/' | relative_url }}"{% if page.url == '/docket/' or page.url == '/cases/' %} aria-current="page"{% endif %}>Docket</a>
      <a href="{{ '/caselaw/' | relative_url }}"{% if page.url == '/caselaw/' or page.url == '/case-search.html' %} aria-current="page"{% endif %}>Case Law</a>
      <a href="{{ '/records/' | relative_url }}"{% if page.url == '/records/' %} aria-current="page"{% endif %}>Records</a>
      <details class="nav-menu"{% if page.collection or page.url == '/frap/' or page.url == '/frcp/' or page.url == '/frcmp/' or page.url == '/fre/' or page.url == '/supct/' %} data-current="true"{% endif %}>
        <summary>Rules of Procedure</summary>
        <div class="nav-menu__panel">
          <a href="{{ '/frcp/' | relative_url }}"{% if page.collection == 'frcp' or page.url == '/frcp/' %} aria-current="page"{% endif %}>Civil Procedure</a>
          <a href="{{ '/frcmp/' | relative_url }}"{% if page.collection == 'frcmp' or page.url == '/frcmp/' %} aria-current="page"{% endif %}>Criminal Procedure</a>
          <a href="{{ '/fre/' | relative_url }}"{% if page.collection == 'fre' or page.url == '/fre/' %} aria-current="page"{% endif %}>Rules of Evidence</a>
          <a href="{{ '/supct/' | relative_url }}"{% if page.collection == 'supct' or page.url == '/supct/' %} aria-current="page"{% endif %}>Supreme Court Rules</a>
          <a class="nav-menu__secondary" href="{{ '/frap/' | relative_url }}"{% if page.collection == 'frap' or page.url == '/frap/' %} aria-current="page"{% endif %}>Appellate Rules Reference</a>
        </div>
      </details>
      <a href="{{ '/docs/' | relative_url }}"{% if page.url == '/docs/' %} aria-current="page"{% endif %}>Documents</a>
      <a class="primary-nav__related" href="{{ site.related_sites.us_code }}" aria-label="U.S. Code, related site">U.S. Code <span aria-hidden="true">↗</span></a>
    </div>
  </nav>
</header>
