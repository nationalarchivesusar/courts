<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
{% include head.html %}
<body class="page-rules-index">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include header.html %}

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
      <li><a href="{{ '/' | relative_url }}">United States Courts</a></li>
      <li><a href="{{ '/#rules-procedure' | relative_url }}">Rules &amp; Procedure</a></li>
      <li aria-current="page">{{ page.title }}</li>
    </ol>
  </nav>

  <main id="main-content" class="content-shell rules-index" tabindex="-1">
    <header class="page-heading">
      <p class="eyebrow">Rules &amp; Procedure</p>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </header>
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
